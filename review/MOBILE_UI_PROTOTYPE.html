 case &#x27;story&#x27;:return `${scene()}&lt;div class=&quot;dnt-copy&quot;&gt;&lt;p&gt;У хаті бабусіта садить вас за стіл і починає накривати поляну.&lt;/p&gt;&lt;p&gt;Картопля, мʼясо, сало, хліб, соління, потім ще щось наливає в кухоль і підсуває ближче.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;dnt-quick&quot;&gt;&lt;button class=&quot;cursor-interaction&quot; data-action=&quot;use-water&quot; ${s.items.water?&#x27;&#x27;:&#x27;disabled&#x27;}&gt;Вода · ${s.items.water}&lt;/button&gt;&lt;button class=&quot;cursor-interaction&quot; data-view=&quot;needs&quot;&gt;Активні стани&lt;/button&gt;&lt;button class=&quot;cursor-interaction&quot; data-view=&quot;inventory&quot;&gt;Рюкзак&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;dnt-choices&quot;&gt;${button(&#x27;Продовжити розмову&#x27;,&#x27;talk&#x27;,&#x27;5 хв · без фізичного навантаження&#x27;,false,true)}${button(&#x27;Оглянути місце&#x27;,&#x27;location&#x27;,&#x27;Запаси, допомога й відпочинок&#x27;)}${button(&#x27;Попросити додаткову воду&#x27;,&#x27;ask&#x27;,s.helped?&#x27;Допомогу вже отримано&#x27;:s.stats.charisma&gt;=3?&#x27;Харизма: доступна домовленість · 5 хв&#x27;:&#x27;Харизма 3 або допомога по господарству · 15 хв&#x27;,s.helped)}&lt;/div&gt;`;
 case &#x27;location&#x27;:return `${title(&#x27;Місце&#x27;)}&lt;div class=&quot;dnt-sub&quot;&gt;Хата баби Галі · ${night()?&#x27;ніч&#x27;:&#x27;вечір&#x27;}&lt;/div&gt;&lt;div class=&quot;dnt-note&quot;&gt;${night()?&#x27;Пізно. Пошук надворі потребує більше часу й енергії.&#x27;:&#x27;Ще можна оглянути двір перед темрявою.&#x27;}&lt;/div&gt;${button(&#x27;Оглянути дозволені припаси&#x27;,&#x27;search&#x27;,s.searched?&#x27;Місце оглянуте · запаси вичерпано&#x27;:`Разовий пошук · ${searchMinutes()} хв · можливе поповнення`,s.searched)}${button(&#x27;Попросити води у Галі&#x27;,&#x27;ask&#x27;,s.helped?&#x27;Додатковий запас отримано&#x27;:s.stats.charisma&gt;=3?&#x27;Домовитися · 5 хв&#x27;:&#x27;Допомогти по господарству · 15 хв&#x27;,s.helped)}${button(&#x27;Відпочинок&#x27;,&#x27;rest-view&#x27;,&#x27;Місце, тривалість і відновлення&#x27;)}&lt;div class=&quot;dnt-note&quot;&gt;Шукати можна тільки там, де вам дозволили. Запаси не зʼявляються знову після відкриття меню.&lt;/div&gt;`;
 case &#x27;inventory&#x27;:return `${title(&#x27;Рюкзак&#x27;)}&lt;div class=&quot;dnt-sub&quot;&gt;${Object.values(s.items).filter(n=&gt;n&gt;0).length}/16 місць · важливі речі окремо&lt;/div&gt;${Object.entries({water:[&#x27;Вода&#x27;,&#x27;Відновлює воду&#x27;,30],salo:[&#x27;Сало&#x27;,&#x27;Відновлює ситість&#x27;,25],garlic:[&#x27;Часник&#x27;,&#x27;Можна використати в конфлікті&#x27;,0],medkit:[&#x27;Аптечка&#x27;,&#x27;Відновлює здоров’я&#x27;,25]}).map(([k,d])=&gt;`&lt;div class=&quot;dnt-row&quot;&gt;&lt;div&gt;${d[0]} · ${s.items[k]}&lt;div class=&quot;dnt-sub&quot;&gt;${d[1]}${d[2]?` · +${d[2]}`:&#x27;&#x27;}&lt;/div&gt;&lt;/div&gt;&lt;button class=&quot;cursor-interaction&quot; data-action=&quot;use-${k}&quot; ${s.items[k]===0||k===&#x27;garlic&#x27;?&#x27;disabled&#x27;:&#x27;&#x27;}&gt;${k===&#x27;garlic&#x27;?&#x27;Для ситуації&#x27;:&#x27;Використати&#x27;}&lt;/button&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;div class=&quot;dnt-note&quot;&gt;Невідоме зілля&lt;br&gt;&lt;span class=&quot;dnt-sub&quot;&gt;Ефект: ??? · знання відкривається в історії.&lt;/span&gt;&lt;/div&gt;`;
 case &#x27;hero&#x27;:return `${title(&#x27;Степан&#x27;)}&lt;div class=&quot;dnt-tabs&quot;&gt;${[[&#x27;profile&#x27;,&#x27;Персонаж&#x27;],[&#x27;progress&#x27;,&#x27;Характеристики&#x27;],[&#x27;states&#x27;,&#x27;Стани&#x27;],[&#x27;clothes&#x27;,&#x27;Одяг&#x27;]].map(([key,label])=&gt;`&lt;button class=&quot;cursor-interaction&quot; data-herotab=&quot;${key}&quot; aria-pressed=&quot;${s.heroTab===key}&quot;&gt;${label}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;${s.heroTab===&#x27;profile&#x27;?profile():s.heroTab===&#x27;states&#x27;?states():s.heroTab===&#x27;clothes&#x27;?clothes():statPanel()}`;
 case &#x27;stats&#x27;:return `${title(&#x27;Характеристики&#x27;)}${statPanel()}`;
 case &#x27;states&#x27;:return `${title(&#x27;Стани&#x27;)}${states()}`;
 case &#x27;needs&#x27;:return `${title(&#x27;Стан Степана&#x27;)}${needs()}`;
 case &#x27;rest&#x27;:return `${title(&#x27;Відпочинок&#x27;)}&lt;div class=&quot;dnt-note&quot;&gt;Хата баби Галі · можна перепочити&lt;/div&gt;${button(&#x27;Короткий відпочинок&#x27;,&#x27;rest&#x27;,&#x27;30 хв · енергія +18 · потреби витрачаються&#x27;,false,true)}&lt;div class=&quot;dnt-note&quot;&gt;Сон доступний лише в дозволений сюжетний момент. Посеред нападу відпочити не можна.&lt;/div&gt;`;
 case &#x27;menu&#x27;:return `${title(&#x27;Меню&#x27;)}&lt;h3&gt;Люди&lt;/h3&gt;${row(&#x27;Персонажі й стосунки&#x27;,&#x27;Відомі факти та поведінка&#x27;,&#x27;people&#x27;)}${row(&#x27;Євпапій&#x27;,&#x27;Стан і допомога&#x27;,&#x27;companion&#x27;)}&lt;h3 style=&quot;margin-top:18px&quot;&gt;Світ&lt;/h3&gt;${row(&#x27;Журнал&#x27;,&#x27;Мета, підказки й рішення&#x27;,&#x27;journal&#x27;)}${row(&#x27;Карта&#x27;,&#x27;Відкриті місця&#x27;,&#x27;map&#x27;)}${row(&#x27;Доступна допомога&#x27;,&#x27;Ресурси й умови&#x27;,&#x27;shop&#x27;)}&lt;h3 style=&quot;margin-top:18px&quot;&gt;Гра&lt;/h3&gt;${row(&#x27;Збереження&#x27;,&#x27;Автосейв і три ручні слоти&#x27;,&#x27;save&#x27;)}${row(&#x27;Налаштування&#x27;,&#x27;Текст, сцена й звук&#x27;,&#x27;settings&#x27;)}`;
 case &#x27;people&#x27;:return `${title(&#x27;Персонажі й стосунки&#x27;)}&lt;details open&gt;&lt;summary&gt;Баба Галя&lt;/summary&gt;&lt;div class=&quot;dnt-note&quot;&gt;Ви знайомі. Допомогла після сараю.&lt;br&gt;${s.helped?&#x27;Відгукнулася на ваше прохання. Додаткову воду отримано.&#x27;:&#x27;Можна попросити додаткову воду або допомогти по господарству.&#x27;}&lt;/div&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Євпапій&lt;/summary&gt;&lt;div class=&quot;dnt-note&quot;&gt;З вами. Памʼятає, як ви з ним поводились. Готовність допомагати видно з його дій.&lt;/div&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Постать&lt;/summary&gt;&lt;div class=&quot;dnt-note&quot;&gt;Особу не встановлено. Звідки знає вас: ???&lt;/div&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Риже гамно&lt;/summary&gt;&lt;div class=&quot;dnt-note&quot;&gt;Відомі спостереження зʼявляться після фактичної зустрічі.&lt;/div&gt;&lt;/details&gt;`;
 case &#x27;companion&#x27;:return `${title(&#x27;Євпапій&#x27;)}&lt;div class=&quot;dnt-note&quot;&gt;З вами · ${s.pigeonHp}/50 HP · рівень 1&lt;br&gt;&lt;span class=&quot;dnt-sub&quot;&gt;Може відволікти противника. Це ризик для нього.&lt;/span&gt;&lt;/div&gt;${row(&#x27;Атака / агресія&#x27;,&#x27;Допомога в ризиковій ситуації&#x27;,&#x27;battle&#x27;,&#x27;Переглянути сутичку&#x27;)}&lt;p class=&quot;dnt-sub&quot;&gt;Числа довіри й образи приховані. Про готовність допомагати говорить поведінка.&lt;/p&gt;`;
 case &#x27;journal&#x27;:return `${title(&#x27;Журнал&#x27;)}&lt;h3&gt;Зараз&lt;/h3&gt;&lt;div class=&quot;dnt-note&quot;&gt;Відновитися після пригоди біля сараю й розібратися з тим, що сталося.&lt;/div&gt;&lt;h3&gt;Ваші дії&lt;/h3&gt;&lt;div class=&quot;dnt-row&quot;&gt;${s.searched?&#x27;Оглянули припаси · місце вичерпане.&#x27;:&#x27;Додаткові припаси ще не оглянуто.&#x27;}&lt;/div&gt;&lt;div class=&quot;dnt-row&quot;&gt;${s.helped?&#x27;Отримали додаткову воду від Галі.&#x27;:&#x27;Ще можна попросити допомогу.&#x27;}&lt;/div&gt;&lt;h3 style=&quot;margin-top:15px&quot;&gt;Відомі підказки&lt;/h3&gt;&lt;div class=&quot;dnt-note&quot;&gt;Постать: особу не встановлено.&lt;br&gt;Записи містять тільки те, що ви вже бачили.&lt;/div&gt;`;
 case &#x27;map&#x27;:return `${title(&#x27;Карта&#x27;)}&lt;div class=&quot;dnt-note&quot;&gt;Зараз: хата баби Галі&lt;/div&gt;${row(&#x27;Двір&#x27;,&#x27;Дозволені пошуки залежать від доби&#x27;,&#x27;location&#x27;,&#x27;Оглянути&#x27;)}${row(&#x27;Хата&#x27;,&#x27;Припаси й відпочинок&#x27;,&#x27;location&#x27;,&#x27;Оглянути&#x27;)}&lt;div class=&quot;dnt-row&quot;&gt;&lt;div&gt;Сарай&lt;div class=&quot;dnt-sub&quot;&gt;Повернення зараз не передбачене сюжетом.&lt;/div&gt;&lt;/div&gt;&lt;button disabled&gt;Недоступно&lt;/button&gt;&lt;/div&gt;`;
 case &#x27;shop&#x27;:return `${title(&#x27;Допомога&#x27;)}&lt;div class=&quot;dnt-note&quot;&gt;Баба Галя · додатковий запас обмежений&lt;/div&gt;${button(&#x27;Попросити води&#x27;,&#x27;ask&#x27;,s.helped?&#x27;Запас уже отримано&#x27;:s.stats.charisma&gt;=3?&#x27;Домовленість · 5 хв&#x27;:&#x27;Допомога по господарству · 15 хв&#x27;,s.helped)}&lt;div class=&quot;dnt-note&quot;&gt;Канонічна гостинність не залежить від високої харизми. Навичка змінює умови додаткової допомоги.&lt;/div&gt;`;
 case &#x27;save&#x27;:return `${title(&#x27;Збереження&#x27;)}&lt;div class=&quot;dnt-note&quot;&gt;Проходження 1 · глава 3&lt;br&gt;&lt;span class=&quot;dnt-sub&quot;&gt;Хата баби Галі · ${time()}&lt;/span&gt;&lt;/div&gt;${s.slots.map((snap,i)=&gt;`&lt;div class=&quot;dnt-row&quot;&gt;&lt;div&gt;Слот ${i+1}&lt;div class=&quot;dnt-sub&quot;&gt;${snap?`Глава 3 · ${snap.hp} HP · ${snap.xp} XP`:&#x27;Порожньо&#x27;}&lt;/div&gt;&lt;/div&gt;&lt;button class=&quot;cursor-interaction&quot; data-action=&quot;save-${i}&quot;&gt;Зберегти&lt;/button&gt;${snap?`&lt;button class=&quot;cursor-interaction&quot; data-action=&quot;load-${i}&quot;&gt;Відкрити&lt;/button&gt;`:&#x27;&#x27;}&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;div class=&quot;dnt-note&quot;&gt;Початок глави 3 · попередні рішення збережені.&lt;/div&gt;`;
 case &#x27;settings&#x27;:return `${title(&#x27;Налаштування&#x27;)}&lt;h3&gt;Читання&lt;/h3&gt;&lt;div class=&quot;dnt-tabs&quot;&gt;${[15,17,19].map(v=&gt;`&lt;button class=&quot;cursor-interaction&quot; data-action=&quot;font-${v}&quot; aria-pressed=&quot;${design.reading===v}&quot;&gt;${v===15?&#x27;Звичайний&#x27;:v===17?&#x27;Більший&#x27;:&#x27;Великий&#x27;} текст&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;label class=&quot;dnt-check&quot;&gt;Показувати шкали потреб&lt;input data-setting=&quot;bars&quot; type=&quot;checkbox&quot; ${design.bars?&#x27;checked&#x27;:&#x27;&#x27;}&gt;&lt;/label&gt;&lt;label class=&quot;dnt-check&quot;&gt;Звук&lt;input data-setting=&quot;sound&quot; type=&quot;checkbox&quot; ${s.sound?&#x27;checked&#x27;:&#x27;&#x27;}&gt;&lt;/label&gt;&lt;label class=&quot;dnt-check&quot;&gt;Гучність&lt;input type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;80&quot; aria-label=&quot;Загальна гучність&quot;&gt;&lt;/label&gt;&lt;label class=&quot;dnt-check&quot;&gt;Атмосфера&lt;input type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;48&quot; aria-label=&quot;Гучність атмосфери&quot;&gt;&lt;/label&gt;&lt;label class=&quot;dnt-check&quot;&gt;Ефекти&lt;input type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;72&quot; aria-label=&quot;Гучність ефектів&quot;&gt;&lt;/label&gt;${button(&#x27;Бойовий тест&#x27;,&#x27;battle&#x27;,&#x27;Окремий перегляд сутички&#x27;)}`;
 case &#x27;battle&#x27;:return battle();
 default:s.view=&#x27;story&#x27;;return content();
 }}
 function profile(){return `&lt;div class=&quot;dnt-row&quot;&gt;&lt;img src=&quot;${assets.hero}&quot; alt=&quot;Степан&quot; style=&quot;height:160px;width:125px;object-fit:contain&quot;&gt;&lt;div&gt;&lt;h3&gt;Степан&lt;/h3&gt;&lt;p&gt;Рівень ${s.level} · ${s.xp}/100 XP&lt;/p&gt;&lt;p&gt;Хата баби Галі&lt;/p&gt;&lt;p class=&quot;dnt-sub&quot;&gt;Євпапій з вами&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;${row(&#x27;Характеристики&#x27;,s.points?&#x27;Є очко розвитку&#x27;:&#x27;Переглянути ефективні значення&#x27;,&#x27;stats&#x27;)}${row(&#x27;Стани та потреби&#x27;,`Здоров’я ${s.hp}% · вода ${s.water}%`,&#x27;states&#x27;)}${row(&#x27;Спорядження&#x27;,&#x27;Місцевий одяг · броня й тепло&#x27;,&#x27;inventory&#x27;)}`}
 function statPanel(){return `&lt;p&gt;Рівень ${s.level} · ${s.xp}/100 XP&lt;/p&gt;&lt;div class=&quot;dnt-progress&quot;&gt;&lt;div style=&quot;width:${s.xp}%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;dnt-note dnt-warning&quot;&gt;${s.points?`${s.points} очко розвитку · можна застосувати зараз`:&#x27;Очки витрачено · розвиток збережено&#x27;}&lt;/div&gt;&lt;div class=&quot;dnt-statgrid&quot;&gt;${Object.entries(stats).map(([k,d])=&gt;`&lt;div class=&quot;dnt-stat&quot;&gt;${d[0]} &lt;b&gt;${s.stats[k]}&lt;/b&gt;&lt;div class=&quot;dnt-sub&quot;&gt;${d[1]}&lt;/div&gt;&lt;button class=&quot;cursor-interaction&quot; data-action=&quot;point-${k}&quot; ${s.points?&#x27;&#x27;:&#x27;disabled&#x27;}&gt;Розвинути +1&lt;/button&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`}
 function states(){return `${s.water&lt;=40?`&lt;div class=&quot;dnt-note dnt-warning&quot;&gt;&lt;h3&gt;СУШНЯК&lt;/h3&gt;&lt;p&gt;Уважність −1. Після фізичних дій вода витрачається далі.&lt;/p&gt;${button(&#x27;Випити воду&#x27;,&#x27;use-water&#x27;,&#x27;Вода +30 · пляшка −1&#x27;,s.items.water===0)}&lt;/div&gt;`:&#x27;&lt;p&gt;Спрагу знято.&lt;/p&gt;&#x27;}${s.energy&lt;35?&#x27;&lt;div class=&quot;dnt-note&quot;&gt;&lt;h3&gt;ЗАЄБАВСЯ&lt;/h3&gt;&lt;p&gt;Уважність −1 · спритність −1. Бойові дії дорожчі.&lt;/p&gt;&lt;/div&gt;&#x27;:&#x27;&#x27;}&lt;details&gt;&lt;summary&gt;Відомі минулі стани&lt;/summary&gt;&lt;div class=&quot;dnt-note&quot;&gt;&lt;h3&gt;ЖОСТКИЙ БУДУНЯРА&lt;/h3&gt;&lt;p&gt;Знято. Після води, їжі та відпочинку полегшало.&lt;/p&gt;&lt;h3&gt;СРАНИЙ ГОЛУБ ВАС ПРИНИЗИВ&lt;/h3&gt;&lt;p&gt;Знято після зміни одягу.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;${needs()}`}

&lt;script&gt;

  if (window.FloatingUIDOM == null) {
    return;
  }

  }`;

  const hoverDelay = 700;
  const skipDelay = 300;

  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

    target?.nodeType != null &amp;&amp; trigger.contains(target);

    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);

  };

    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };

    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }

    activeTrigger = null;

    }

      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),

            );

              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,

      strategy: &quot;fixed&quot;,

      .then(({ x, y }) =&gt; {

          return;

    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger

      return;
    }

      trigger == null ||

      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {

    if (pinnedByTouch) {
      return;
    }

    if (event.key === &quot;Escape&quot;) {

    }

    lastPointerWasTouch = false;

    pointerdown: handlePointer,
    pointercancel: handlePointer,
    click: handleTouchClick,
    pointerout: handleLeave,

    focusout: handleLeave,
    keydown: handleKeyDown,

  const handledEvents = new WeakSet();
  const handleEvent = (event) =&gt; {
    if (handledEvents.has(event)) return;
    handledEvents.add(event);
    handlers[event.type](event);
  };

    if (node.shadowRoot) listen(node.shadowRoot);
    for (const element of node.querySelectorAll(&quot;*&quot;)) {
      if (element.shadowRoot) listen(element.shadowRoot);
    }

    if (roots.has(root)) return;
    for (const type of Object.keys(handlers)) root.addEventListener(type, handleEvent);
    const observer = new window.MutationObserver((records) =&gt; {
      for (const { addedNodes } of records) {
        for (const node of addedNodes) {
          if (node.nodeType === Node.ELEMENT_NODE) discoverRoots(node);
        }
      }
      for (const [root, cleanup] of roots) {
        if (root.host &amp;&amp; !root.host.isConnected) {
          cleanup();
          roots.delete(root);
        }
      }
      if (activeTrigger &amp;&amp; !activeTrigger.isConnected) closeTooltip(false);
    });
    observer.observe(root, { childList: true, subtree: true });
    roots.set(root, () =&gt; {
      observer.disconnect();
      for (const type of Object.keys(handlers)) root.removeEventListener(type, handleEvent);
    });
    discoverRoots(root);
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    for (const cleanup of roots.values()) cleanup();
    roots.clear();
    tooltip = null;
  };

  // Events between children of one shadow root never reach the document.
  listen(document);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
